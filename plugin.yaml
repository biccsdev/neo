name: neo
version: 0.1.0
manifest_version: 2
api_version: 1
description: "Voice-first macOS mission control for Hermes: durable parallel coding, Blender, and browser tasks with live previews."
author: NEO contributors
license: MIT
homepage: https://github.com/biccsdev/neo
platforms:
  - macos
requires_hermes: ">=0.22.6"
tags:
  - macos
  - orchestration
  - codex
  - claude
  - blender
  - browser
provides_tools:
  - neo_submit_task
  - neo_task_status
  - neo_task_list
  - neo_task_refine
  - neo_task_cancel
  - neo_task_frame_follow_up
  - neo_task_open
provides_hooks:
  - pre_llm_call
